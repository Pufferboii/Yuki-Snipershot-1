      }</script><script>// Declaring Global Vars
    let db;
    const request = window.indexedDB.open("NullGames", 1);
    const urlParams = new URLSearchParams(window.location.search);
    //const pageVisiting = urlParams.get('p');
    const hashValue = window.location.hash; 
    const pageVisiting = window.location.hash.substring(1);
    // inlined.js belongs here
    // DB success & error
    request.onerror = (event) => {
      console.error("IndexedDB has run into an error!");
      alert("IndexedDB has run into an error. It is unlikely that this service will continue to work as of current.");
    };
    request.onsuccess = (event) => {
      db = event.target.result; // Put all start functions here!!!!!!!
      start();
    };
    request.onupgradeneeded = (event) => { // make sure this works in all browsers, apparently it may not work sometimes??
      // Save the IDBDatabase interface
      localStorage.setItem("ThemeColor", "#E7E7E7");
      localStorage.setItem("Connection", "https://cdn.jsdelivr.net/gh/NulliousBit/Store/Store.json");
      const db = event.target.result;
      // Create an objectStore for this database
      const objectStore = db.createObjectStore("Pages", {
        keyPath: "ID"
      }); //Maybe need to add an alert or smth in a future update if the way we change stuff ever changes
    };
    // Functions
    async function loadFromDatabase(key) {
      var pageInformation = await (getResponseFromKey("Pages", key));
      loadPage(pageInformation.Name, pageInformation.Thumbnail, pageInformation.Code);
    }
    async function loadFromBundled(key, encodedCode) {
      var pageInformation = bundledPages[key];
      if (encodedCode) {
        loadPage(pageInformation[0], pageInformation[1], atob(pageInformation[2]));
      } else {
        loadPage(pageInformation[0], pageInformation[1], pageInformation[2]);
      }
    }
    async function loadPage(Name, Thumbnail, Code) {
      document.title = Name + " | NullGames";
      document.getElementById("viewer").srcdoc = Code;
    }

    function addPage(id, name, thumbnail, code) {
      addToIndexedDB("Pages", id, name, thumbnail, code);
    }

    function addToIndexedDB(page, key, name, thumbnail, code) {
      const transaction = db.transaction([page], "readwrite"); // maybe sometimes replace "readwrite" with IDBTransaction.READ_WRITE for older browsers.
      //transaction end statuses
      transaction.oncomplete = (event) => {
        console.log("Transaction Connected!");
      };
      transaction.onerror = (event) => {
        console.error("Transaction Error.");
      };
      const objectStore = transaction.objectStore(page);
      const request = objectStore.put({
        ID: key,
        Name: name,
        Thumbnail: thumbnail,
        Code: code
      });
      request.onsuccess = (event) => {
        console.log("Request Success!!!");
      };
    }

    function removeFromIndexedDB(page, key) {
      const transaction = db.transaction([page], "IDBTransaction.READ_WRITE"); // read_write was changed to this for compatibility
      //transaction end statuses
      transaction.oncomplete = (event) => {
        console.log("Transaction Connected!");
      };
      transaction.onerror = (event) => {
        console.error("Transaction Error.");
      };
      const objectStore = transaction.objectStore(page);
      const request = objectStore.delete(key);
      request.onsuccess = (event) => {
        console.log("Request Success!!!");
      };
    }

    function getResponseFromKey(page, key) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([page], "readwrite");
        //transaction end statuses
        transaction.oncomplete = (event) => {
          console.log("Transaction Connected!");
        };
        transaction.onerror = (event) => {
          console.error("Transaction Error.");
        };
        const objectStore = transaction.objectStore(page);
        const request = objectStore.get(key);
        request.onsuccess = (event) => {
          console.log("Request Success!!!" + event.target.result);
          resolve(event.target.result);
        };
      });
    }

    function getAllKeys(page) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([page], "readwrite");
        //transaction end statuses
        transaction.oncomplete = (event) => {
          console.log("Transaction Connected!");
        };
        transaction.onerror = (event) => {
          console.error("Transaction Error.");
        };
        const objectStore = transaction.objectStore(page);
        const request = objectStore.getAllKeys();
        request.onsuccess = (event) => {
          console.log("Request Success!!!" + event.target.result);
          resolve(event.target.result);
        };
      });
    }
    async function start() {
      document.getElementById("htmlBody").style.backgroundColor = localStorage.getItem("ThemeColor");
      changePage(pageVisiting);
    }
    async function changePage(Page) {
      var allKeys = await getAllKeys("Pages", true);
      if (!Page || Page == "") {
        toPage("Menu");
      } else if (Page) {
        if (allKeys.includes(Page)) {
          loadFromDatabase(Page);
        } else {
          allKeys = Object.keys(bundledPages);
          if (allKeys.includes(Page)) {
            loadFromBundled(Page, true);
          } else {
            alert("ERROR: The Page ID is not within the list of keys.");
          }
        }
      }
    }

    function toPage(page) {
      //posthog.capture('toPage', {response: page})
      location.href = "#" + page;
      resetFullscreen()
      changePage(page);
      console.clear
    }
    function hideFullscreen(){
      document.getElementById("FullScreen").style = "display: none;";
    }
    function resetFullscreen(){
      document.getElementById("FullScreen").style = "";
    }</script><style>button{background-color:rgba(198,198,198,.05);border-radius:8px;border-width:0;color:#888;cursor:pointer;display:inline-block;font-family:"Haas Grot Text R Web","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;font-weight:500;line-height:20px;list-style:none;margin:0;padding:10px 10px;text-align:center;transition:all .2s;vertical-align:baseline;white-space:nowrap;user-select:none;-webkit-user-select:none;touch-action:manipulation;text-decoration-color:#000}#viewer{height:calc(100% - 44.75px)}</style></html>
